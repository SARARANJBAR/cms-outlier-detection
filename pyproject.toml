[project]
name = "cms-outliers"
version = "0.1.0"
description = "CMS provider outlier detection: data pipeline, SQL, and Streamlit app"
readme = "README.md"
authors = [
    { name = "SARARANJBAR", email = "sararanjbar.phd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "duckdb>=1.5.5",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
# Notebooks are exploration records: their SQL is column-aligned for reading, and their
# outputs are committed measurements (project rule 7). Reformatting them would churn
# those outputs for no benefit, so lint covers shipped code only.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
