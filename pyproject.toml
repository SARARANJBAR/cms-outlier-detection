[project]
name = "cms-outliers"
version = "0.1.0"
description = "CMS provider outlier detection: data pipeline, SQL, and Streamlit app"
readme = "README.md"
authors = [
    { name = "SARARANJBAR", email = "sararanjbar.phd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
]

[project.scripts]
cms-outliers = "cms_outliers:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
